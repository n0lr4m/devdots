name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.gitignore'

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build and Publish Windows x64 Binary
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Get Version / Commit Hash
        id: vars
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $dateTag = Get-Date -Format "yyyyMMdd-HHmmss"
          $tag = "v1.0.$dateTag-$shortSha"
          echo "TAG=$tag" >> $env:GITHUB_ENV
          echo "RELEASE_NAME=Devdots CLI $tag" >> $env:GITHUB_ENV

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: bin/Release/net10.0/win-x64/publish/devdots.exe
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Automated release for Windows x64 of the devdots CLI utility.
            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

